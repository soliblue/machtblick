name: Upload iOS App Store Assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-store-assets
  cancel-in-progress: false

jobs:
  upload:
    name: Upload App Store assets
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
      - name: Check release version
        run: node apps/ios/scripts/check-release-version.mjs
      - name: Check App Store screenshots
        run: npm run ios:screenshots:check
      - name: Install fastlane
        run: gem install fastlane --version 2.237.0 --no-document
      - name: Upload metadata and screenshots
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: 1
        run: fastlane ios app_store_assets
