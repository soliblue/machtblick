name: Submit iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to submit, must match apps/ios/Config/Version.xcconfig
        required: true
        type: string
      build_number:
        description: TestFlight build number to submit, defaults to the latest for the version
        required: false
        type: string
      whats_new_de:
        description: German release notes shown on the App Store
        required: false
        type: string
        default: Verbesserungen und Fehlerbehebungen.
      whats_new_en:
        description: English release notes shown on the App Store
        required: false
        type: string
        default: Improvements and bug fixes.
      update_release_mode_only:
        description: Update automatic release without resubmitting an existing review
        required: false
        type: boolean
        default: false
      inspect_only:
        description: Read the App Store version and attached build without changes
        required: false
        type: boolean
        default: false
      replaces_build_number:
        description: Submitted build to replace after the new build is VALID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-appstore-release
  cancel-in-progress: false

jobs:
  submit:
    name: Submit for App Store review
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ inputs.inspect_only && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check release version
        run: node apps/ios/scripts/check-release-version.mjs
      - name: Install fastlane
        if: ${{ !inputs.inspect_only }}
        run: gem install fastlane --version 2.237.0 --no-document
      - name: Install App Store dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/python" -m pip install requests==2.34.2 cryptography==49.0.0
          echo "$RUNNER_TEMP/asc-venv/bin" >> "$GITHUB_PATH"
      - name: Inspect App Store versions
        if: ${{ inputs.inspect_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: python3 .github/scripts/appstore_release_status.py
      - name: Check review replacement guards
        if: ${{ !inputs.inspect_only && !inputs.update_release_mode_only && inputs.replaces_build_number != '' }}
        run: python3 -m unittest discover -s .github/scripts -p test_appstore_review_replace.py
      - name: Replace previous review submission
        if: ${{ !inputs.inspect_only && !inputs.update_release_mode_only && inputs.replaces_build_number != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPLACED_BUILD_NUMBER: ${{ inputs.replaces_build_number }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 .github/scripts/appstore_review_replace.py
      - name: Prepare App Store version
        if: ${{ !inputs.inspect_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/asc_appstore.py
      - name: Submit build for review
        if: ${{ !inputs.inspect_only && !inputs.update_release_mode_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          WHATS_NEW_DE: ${{ inputs.whats_new_de }}
          WHATS_NEW_EN: ${{ inputs.whats_new_en }}
        run: |
          cd fastlane
          fastlane ios release "version:$RELEASE_VERSION" "build_number:$RELEASE_BUILD_NUMBER_INPUT"
      - name: Verify submitted version
        if: ${{ !inputs.inspect_only && !inputs.update_release_mode_only }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          RELEASE_VERSION: ${{ inputs.version }}
          WHATS_NEW_DE: ${{ inputs.whats_new_de }}
          WHATS_NEW_EN: ${{ inputs.whats_new_en }}
        run: python3 .github/scripts/asc_appstore_verify.py
      - name: Summary
        if: ${{ !inputs.inspect_only && !inputs.update_release_mode_only }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "Submitted Machtblick $RELEASE_VERSION build $RELEASE_BUILD_NUMBER for App Store review." >> "$GITHUB_STEP_SUMMARY"
          echo "Release after approval is automatic." >> "$GITHUB_STEP_SUMMARY"
      - name: Release mode summary
        if: ${{ !inputs.inspect_only && inputs.update_release_mode_only }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: echo "Machtblick $RELEASE_VERSION will release automatically after approval." >> "$GITHUB_STEP_SUMMARY"
